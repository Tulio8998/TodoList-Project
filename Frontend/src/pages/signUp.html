<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/signUp.css">
    <link rel="stylesheet" href="../styles/top-bar.css">
</head>
<body>
    <top-bar></top-bar>

    <main class="main-content">
        <section class="container">
            <div class="signUp-content">
                <div class="form-content">
                    <h2>Cadastro de usuario</h2>
                    <form action="">
                        <div class="input-data">
                            <div>
                                <p>Nome:</p>
                                <input class="input-up" type="text" placeholder="nome">
                            </div>
                            <div>
                                <p>Email:</p>
                                <input class="input-up" type="email" placeholder="@email.com">
                            </div>
                            <div>
                                <p>Senha:</p>
                                <input class="input-up" type="password" placeholder="senha">
                            </div>
                        </div>
                        <button>Entrar</button>
                    </form>
                    <a class="signIn-link" href="./signIn.html">Cadastre-se aqui</a>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/components/top-bar.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
